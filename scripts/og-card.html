<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OG card source - Nicholas Smith</title>
<!--
  The source for public/og-image.png, the 1200x630 card that LinkedIn, X, Slack
  and Facebook render when the site is shared.

  It exists as HTML because the card had drifted before: it still said
  "Software Engineer" and "Mobile" long after the site said otherwise, in a
  palette the site had already replaced - so the preview did not look like the
  page it linked to. A PNG cannot be edited; this can.

  Colours and faces are Casefile's, from src/styles/casefile.css: paper and
  ink, the highlighter under the surname as on the hero, the file card with the
  portrait clipped to it, and the night strip the site closes on.

  To regenerate:
    1. open this file in a browser at exactly 1200x630 (headless Edge or Chrome
       with --window-size=1200,630 --screenshot works)
    2. save the viewport as public/og-image.png
  Keep index.html's og:image:alt in step with the chips below.
-->
<style>
@font-face { font-family: 'Instrument Serif'; font-style: normal;
  src: url(../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Instrument Serif'; font-style: italic;
  src: url(../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2) format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-weight: 400;
  src: url(../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-weight: 500;
  src: url(../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 500;
  src: url(../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 600;
  src: url(../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2) format('woff2'); }

:root { --paper: #E9ECEF; --paper-hi: #F6F7F9; --paper-lo: #DCE1E7; --rule: #C3CAD2; --ink: #0F1720;
        --graphite: #4A5563; --hl: #FFD23F; --night: #0B1220; --moon: #E6EAF0; --moon-2: #A3AEBF; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; }
body { background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; -webkit-font-smoothing: antialiased; }

.card { position: relative; width: 1200px; height: 630px; overflow: hidden;
        background-image: repeating-linear-gradient(to bottom, transparent 0 35px, rgba(15,23,32,.05) 35px 36px); }
.grid { display: grid; grid-template-columns: 1fr 330px; gap: 56px; padding: 62px 76px 0; }

.kicker { font: 600 18px/1.4 'IBM Plex Mono', monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--graphite); }
.kicker b { color: var(--ink); font-weight: 600; }
h1 { margin: 18px 0 20px; font: 400 128px/.86 'Instrument Serif', serif; letter-spacing: -.02em; }
h1 span { display: block; }
h1 .last { position: relative; z-index: 0; display: inline-block; font-style: italic; padding-right: 8px; }
h1 .last::before { content: ''; position: absolute; z-index: -1; left: -6px; right: -4px; bottom: 10px; height: 36px;
                   background: var(--hl); border-radius: 3px 9px 4px 10px; }
.disc { font: 400 32px/1.3 'Instrument Serif', serif; max-width: 600px; }
.chips { display: flex; gap: 10px; margin-top: 26px; }
.chip { font: 600 19px/1 'IBM Plex Mono', monospace; padding: 10px 13px; background: var(--ink); color: #F7F9FB; }

.filecard { position: relative; margin-top: 44px; transform: rotate(1.6deg); }
.tab { position: absolute; top: -32px; left: 24px; height: 32px; display: flex; align-items: center; padding: 0 16px;
       background: var(--paper-lo); border: 1px solid var(--rule); border-bottom: 0; border-radius: 7px 7px 0 0;
       font: 600 14px 'IBM Plex Mono', monospace; letter-spacing: .1em; }
.sheet { background: var(--paper-hi); border: 1px solid var(--rule); padding: 22px 22px 18px;
         box-shadow: 0 22px 44px -26px rgba(15,23,32,.5); }
.photo { width: 78%; padding: 8px 8px 30px; background: #fff; border: 1px solid var(--rule); transform: rotate(-2.4deg); position: relative; }
.photo img { display: block; width: 100%; aspect-ratio: 264/325; object-fit: cover; filter: grayscale(.2) contrast(1.03); }
.photo span { position: absolute; left: 10px; bottom: 7px; font: 500 13px 'IBM Plex Mono', monospace; color: var(--graphite); }
.field { display: flex; gap: 12px; align-items: baseline; margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--rule);
         font: 500 13px 'IBM Plex Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--graphite); }
.field b { font: 500 18px 'IBM Plex Sans', sans-serif; letter-spacing: 0; text-transform: none; color: var(--ink); }
.field .yes { background: var(--hl); padding: 0 6px; font-weight: 500; }

.strip { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; justify-content: space-between;
         padding: 0 76px; background: var(--night); color: var(--moon-2); font: 500 20px 'IBM Plex Mono', monospace; letter-spacing: .04em; }
.strip b { color: var(--moon); font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div>
      <p class="kicker"><b>Case file</b> / Software engineer &middot; Data analyst</p>
      <h1><span>Nicholas</span><span class="last">Smith</span></h1>
      <p class="disc">Full-stack web, data analysis and machine learning, built to check its own work.</p>
      <div class="chips">
        <span class="chip">React</span>
        <span class="chip">Python</span>
        <span class="chip">SQL</span>
        <span class="chip">AI/ML</span>
      </div>
    </div>
    <div class="filecard">
      <div class="tab">SMITH, N.</div>
      <div class="sheet">
        <div class="photo"><img src="../src/assets/Nicholas_Smith_profile_pic.webp" alt=""><span>profile.webp</span></div>
        <p class="field">Status <b class="yes">Available</b></p>
      </div>
    </div>
  </div>
  <div class="strip"><b>nicksmith.is-a.dev</b><span>Port of Spain, Trinidad &amp; Tobago</span></div>
</div>
</body>
</html>
